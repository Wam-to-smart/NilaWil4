<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You 💜</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, #b784ff 0%, transparent 30%),
        radial-gradient(circle at 80% 80%, #7d4bc7 0%, transparent 35%),
        linear-gradient(135deg, #170b2b, #35145d, #541d7e);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: white;
    }

    /* Background glow */
    .glow {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: rgba(210, 165, 255, 0.16);
      filter: blur(80px);
      animation: breathe 5s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
        opacity: 0.6;
      }

      50% {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      bottom: -50px;
      color: rgba(255, 210, 255, 0.25);
      animation: floatUp linear infinite;
      pointer-events: none;
    }

    .heart:nth-child(1) {
      left: 8%;
      font-size: 20px;
      animation-duration: 11s;
    }

    .heart:nth-child(2) {
      left: 22%;
      font-size: 13px;
      animation-duration: 8s;
      animation-delay: 2s;
    }

    .heart:nth-child(3) {
      left: 48%;
      font-size: 25px;
      animation-duration: 13s;
      animation-delay: 1s;
    }

    .heart:nth-child(4) {
      left: 72%;
      font-size: 16px;
      animation-duration: 9s;
      animation-delay: 4s;
    }

    .heart:nth-child(5) {
      left: 91%;
      font-size: 22px;
      animation-duration: 12s;
      animation-delay: 3s;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      to {
        transform: translateY(-115vh) rotate(25deg);
        opacity: 0;
      }
    }

    /* Lock card */
    .lock-card {
      position: relative;
      z-index: 5;
      width: min(90%, 410px);
      padding: 48px 38px 40px;

      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 28px;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);

      text-align: center;
    }

    .lock-icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 25px;
      border-radius: 50%;
      display: grid;
      place-items: center;

      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);

      font-size: 28px;
      box-shadow: 0 8px 25px rgba(15, 3, 30, 0.2);
    }

    .tiny-text {
      color: #d9bfff;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 34px;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.66);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .question {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      color: #eadbff;
      font-size: 17px;
      margin-bottom: 12px;
    }

    .input-container {
      position: relative;
      margin-bottom: 14px;
    }

    input {
      width: 100%;
      height: 54px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 15px;
      outline: none;

      background: rgba(13, 5, 25, 0.35);
      color: white;

      padding: 0 50px 0 18px;
      font-size: 15px;
      transition: 0.25s;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    input:focus {
      border-color: #c896ff;
      box-shadow: 0 0 0 3px rgba(190, 130, 255, 0.12);
    }

    .mini-heart {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #d8aaff;
      font-size: 17px;
    }

    button {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 15px;

      background: linear-gradient(135deg, #b47cff, #8c4bd1);
      color: white;

      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;

      box-shadow: 0 10px 28px rgba(124, 61, 184, 0.4);
      transition: 0.25s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 35px rgba(124, 61, 184, 0.55);
    }

    button:active {
      transform: translateY(0);
    }

    #message {
      min-height: 22px;
      margin-top: 17px;
      font-size: 13px;
      color: #ffb8db;
    }

    .footer {
      margin-top: 24px;
      color: rgba(255, 255, 255, 0.32);
      font-size: 11px;
      letter-spacing: 1px;
    }

    /* Shake if password is wrong */
    .shake {
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-8px);
      }

      50% {
        transform: translateX(8px);
      }

      75% {
        transform: translateX(-5px);
      }
    }

    /* Unlock animation */
    .unlocking {
      animation: unlock 0.8s forwards;
    }

    @keyframes unlock {
      to {
        opacity: 0;
        transform: scale(1.08);
        filter: blur(10px);
      }
    }
  </style>
</head>

<body>
  <div class="glow"></div>

  <div class="heart">♡</div>
  <div class="heart">♥</div>
  <div class="heart">♡</div>
  <div class="heart">♥</div>
  <div class="heart">♡</div>

  <div class="lock-card" id="lockCard">

    <div class="lock-icon" id="lockIcon">
      🔒
    </div>

    <div class="tiny-text">Something is waiting</div>

    <h1>Just for you.</h1>

    <p class="subtitle">
      There's a little something hidden behind this door.<br>
      But you should know the answer. ♡
    </p>

    <div class="question">
      What's our name?
    </div>

    <div class="input-container">
      <input
        type="password"
        id="password"
        placeholder="type it here..."
        autocomplete="off"
      />

      <span class="mini-heart">♡</span>
    </div>

    <button onclick="unlock()">
      Unlock ♡
    </button>

    <div id="message"></div>

    <div class="footer">
      MADE WITH A LITTLE LOVE
    </div>

  </div>


  <script>
    const correctPassword = "fuckuslut";

    function unlock() {
      const input = document.getElementById("password");
      const card = document.getElementById("lockCard");
      const message = document.getElementById("message");
      const lockIcon = document.getElementById("lockIcon");

      const enteredPassword = input.value.trim().toLowerCase();

      if (enteredPassword === correctPassword.toLowerCase()) {

        lockIcon.textContent = "🔓";
        message.style.color = "#d8b4ff";
        message.textContent = "I knew you'd remember ♡";

        setTimeout(() => {
          card.classList.add("unlocking");
        }, 600);

        setTimeout(() => {
          // CHANGE THIS to the next page of the website
          window.location.href = "home.html";
        }, 1400);

      } else {

        message.textContent = "Hmm... that's not it ♡";

        card.classList.remove("shake");

        // Forces animation to restart
        void card.offsetWidth;

        card.classList.add("shake");

        input.value = "";
        input.focus();
      }
    }

    // Allow pressing Enter
    document
      .getElementById("password")
      .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
          unlock();
        }
      });
  </script>

</body>
</html>
